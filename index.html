<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0e">
<title>timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap');
:root{
  --bg:#0b0b0e;--bg2:#13131a;--bg3:#1a1a24;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e0e0ee;--text2:rgba(255,255,255,0.45);--text3:rgba(255,255,255,0.42);
  --mono:'JetBrains Mono',monospace;--sans:'Noto Sans JP',sans-serif;
  --radius:10px;--slot-h:74px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:14px 10px 48px;}
/* ── ヘッダー ── */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px;}
.app-header h1{font-family:var(--mono);font-size:14px;font-weight:400;color:var(--text2);letter-spacing:0.12em;}
.header-btns{display:flex;gap:6px;}
.btn-sm{background:var(--bg3);border:0.5px solid var(--border2);border-radius:7px;color:var(--text2);font-size:12px;font-family:var(--sans);padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s,color .15s;}
.btn-sm:hover{background:#22222e;color:var(--text);}
.btn-sm svg{width:13px;height:13px;flex-shrink:0;}
.btn-add{background:#1a2a42;border-color:#2a4468;color:#6aaaf0;}
.btn-add:hover{background:#1e3050;color:#88c0ff;}
/* ── スロット共通 ── */
#slot-list{display:flex;flex-direction:column;gap:5px;}
.slot{position:relative;border-radius:var(--radius);overflow:hidden;height:var(--slot-h);user-select:none;-webkit-user-select:none;}
.slot.dragging{opacity:.4;}
.slot.drag-over{outline:1.5px solid rgba(100,160,255,0.35);}.slot.dragging{opacity:.5;}
.drag-handle{position:absolute;top:0;left:0;width:18px;height:100%;cursor:grab;z-index:10;display:flex;align-items:center;justify-content:center;}
.drag-handle:active{cursor:grabbing;}
.drag-handle-dots{display:flex;flex-direction:column;gap:3px;opacity:0.18;}
.drag-handle-dots span{width:3px;height:3px;background:currentColor;border-radius:50%;display:block;}
.slot-track{position:absolute;inset:0;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);}
.slot-fill{position:absolute;top:0;left:0;height:100%;border-radius:var(--radius) 0 0 var(--radius);z-index:1;}
.slot-fill.full{border-radius:var(--radius);}
/* スロット内レイアウト */
.slot-inner{position:absolute;inset:0;z-index:2;display:flex;align-items:stretch;padding:0;}
/* 左側：時間表示エリア */
.slot-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 8px 22px;min-width:0;}
.slot-name-row{display:flex;align-items:center;gap:5px;margin-bottom:3px;min-width:0;}
.slot-name{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.slot-time{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1;letter-spacing:-0.02em;}
.slot-meta{font-size:10px;color:var(--text3);margin-top:3px;}
/* 右側：ボタンエリア */
.slot-right{display:flex;flex-direction:row;align-items:center;gap:5px;padding:0 8px 0 4px;flex-shrink:0;}
.slot-main-btn{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s;flex-shrink:0;}
.slot-main-btn:hover{background:rgba(255,255,255,0.14);color:rgba(255,255,255,0.9);}
.slot-main-btn svg{width:18px;height:18px;}
.slot-sub-btn{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s;flex-shrink:0;}
.slot-sub-btn:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);}
.slot-sub-btn svg{width:16px;height:16px;}
.slot-del-btn{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);color:rgba(255,80,80,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s;flex-shrink:0;}
.slot-del-btn:hover{background:rgba(100,20,20,0.25);color:rgba(255,80,80,0.8);}
.slot-del-btn svg{width:16px;height:16px;}
.act-btn{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s;flex-shrink:0;}
.act-btn:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);}
.act-btn svg{width:12px;height:12px;}
/* バッジ：右下に */
.slot-badge{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;white-space:nowrap;}
/* ステータス別スタイル */
.s-running .slot-time{color:var(--c-time,#f5d070);}
.s-running .slot-name{color:rgba(255,220,150,0.65);}
.s-running .slot-badge{background:rgba(100,80,10,0.45);color:#d4a840;border:0.5px solid rgba(140,110,20,0.35);}
.s-waiting .slot-time{color:var(--c-time,#65a878);}
.s-waiting .slot-name{color:rgba(180,255,180,0.50);}
.s-waiting .slot-badge{background:rgba(20,60,20,0.55);color:#60aa70;border:0.5px solid rgba(30,80,30,0.35);}
.s-alarm .slot-time{color:var(--c-time,#ff8080);}
.s-alarm .slot-name{color:rgba(255,180,180,0.65);}
.s-alarm .slot-badge{background:rgba(180,30,30,0.4);color:#ff8080;border:0.5px solid rgba(200,50,50,0.35);}
.s-paused .slot-time{color:var(--c-time,#aaaadd);}
.s-paused .slot-name{color:rgba(200,200,255,0.55);}
.s-paused .slot-badge{background:rgba(40,40,80,0.5);color:#9999cc;border:0.5px solid rgba(60,60,120,0.35);}
.s-done .slot-time{color:rgba(255,255,255,0.30);}
.s-done .slot-name{color:rgba(255,255,255,0.30);}
.s-done .slot-badge{background:rgba(40,40,40,0.5);color:#555;border:0.5px solid rgba(80,80,80,0.2);}
/* アラーム点滅：スロット全体 */
@keyframes blink-slot{0%,100%{opacity:1;}50%{opacity:0.35;}}
@keyframes pre-blink{0%,100%{opacity:1;}50%{opacity:0.5;}}
.pre-alarm-blink{animation:pre-blink 0.5s 6;}
.s-alarm.blink-mode .slot-track{animation:none;}
.s-alarm.blink-mode{animation:blink-slot 0.9s infinite;}
/* fullscreen以外のアラームは枠だけ点滅 */
@keyframes blink-track{0%,100%{border-color:rgba(255,80,80,0.2);}50%{border-color:rgba(255,80,80,0.65);}}
.s-alarm:not(.blink-mode) .slot-track{animation:blink-track 0.9s infinite;}
/* ── 時計スロット（タイマーと同じ高さ） ── */
.clock-slot{position:relative;height:var(--slot-h);border-radius:var(--radius);overflow:hidden;cursor:grab;user-select:none;}
.clock-slot.dragging{opacity:.4;}
.clock-slot.drag-over{outline:1.5px solid rgba(100,160,255,0.35);}
.clock-track{position:absolute;inset:0;background:#0d1520;border:0.5px solid #182840;border-radius:var(--radius);}
.clock-inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.clock-date{font-size:11px;color:#5a7898;font-family:var(--sans);}
.clock-time-display{font-family:var(--mono);font-size:24px;font-weight:500;color:#4488cc;letter-spacing:-0.01em;}
.clock-btns{position:absolute;top:50%;right:8px;transform:translateY(-50%);z-index:3;display:flex;gap:5px;align-items:center;}
/* ── モーダル ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100;align-items:center;justify-content:center;padding:14px;}
.modal-overlay.open{display:flex;}
.modal{background:#16161e;border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:20px;width:100%;max-width:390px;max-height:92vh;overflow-y:auto;}
.modal h2{font-size:15px;font-weight:500;color:var(--text);margin-bottom:0;}
.mode-toggle{display:flex;background:var(--bg3);border:0.5px solid var(--border2);border-radius:7px;padding:2px;gap:2px;}
.mode-btn{background:none;border:none;border-radius:5px;color:var(--text2);font-size:12px;font-family:var(--sans);padding:4px 10px;cursor:pointer;transition:background .12s,color .12s;}
.mode-btn.active{background:#1e2a3e;color:#6aaaf0;}
.detail-only{display:none;}
.modal.detail-mode .detail-only{display:block;}
.form-group{margin-bottom:13px;}
.form-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;letter-spacing:.04em;}
.form-group input,.form-group select{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:7px;color:var(--text);font-size:14px;font-family:var(--sans);padding:8px 10px;outline:none;}
.form-group input:focus,.form-group select:focus{border-color:rgba(100,160,255,0.5);}
.form-group select option{background:#16161e;}
.section-title{font-size:11px;color:var(--text2);letter-spacing:.06em;margin:16px 0 10px;padding-bottom:4px;border-bottom:0.5px solid var(--border);}
.threshold-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.threshold-row input[type="number"]{width:72px;flex-shrink:0;}
.threshold-row input[type="color"]{width:34px;height:32px;padding:2px;border-radius:6px;cursor:pointer;flex-shrink:0;}
.threshold-row input[type="text"]{flex:1;}
.btn-add-row{background:none;border:0.5px dashed var(--border2);border-radius:7px;color:var(--text2);font-size:12px;font-family:var(--sans);padding:6px;cursor:pointer;width:100%;margin-top:2px;transition:border-color .15s,color .15s;}
.btn-add-row:hover{border-color:rgba(100,160,255,0.5);color:#6aaaf0;}
.btn-remove-row{background:none;border:none;color:rgba(255,100,100,0.38);cursor:pointer;padding:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-remove-row:hover{color:rgba(255,100,100,0.8);}
.btn-remove-row svg{width:13px;height:13px;}
.trigger-row{background:var(--bg3);border:0.5px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;margin-bottom:7px;}
#f-start-timers-cb{background:var(--bg3);border:0.5px solid var(--border2);border-radius:7px;padding:8px 10px;max-height:160px;overflow-y:auto;}
.trigger-row-top{display:flex;align-items:center;gap:6px;}
.trigger-row-top select{flex:1;}
.trigger-sub{display:flex;gap:6px;align-items:center;}
.trigger-sub select{flex:1;}
.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.btn-modal{background:var(--bg3);border:0.5px solid var(--border2);border-radius:7px;color:var(--text2);font-size:13px;font-family:var(--sans);padding:7px 16px;cursor:pointer;transition:background .12s;}
.btn-modal:hover{background:#22222e;color:var(--text);}
.btn-modal.primary{background:#1a2a42;border-color:#2a4468;color:#6aaaf0;}
.btn-modal.primary:hover{background:#1e3050;}
.btn-modal.danger{background:rgba(80,20,20,0.5);border-color:rgba(150,40,40,0.4);color:#ff7070;}
.btn-modal.danger:hover{background:rgba(100,20,20,0.7);}
/* ── 全画面アラーム ── */
.fullscreen-alarm{display:none;position:fixed;inset:0;z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer;--fa-c1:#130606;--fa-c2:#2c0a0a;}
.fullscreen-alarm.open{display:flex;animation:fa-bg-var 1s infinite;}
@keyframes fa-bg-var{0%,100%{background:var(--fa-c1);}50%{background:var(--fa-c2);}}
@keyframes fa-pulse{0%,100%{opacity:1;}50%{opacity:0.38;}}
.fa-title{font-family:var(--mono);font-size:clamp(26px,7vw,52px);font-weight:500;color:#ff5a5a;animation:fa-pulse 1s infinite;text-align:center;padding:0 28px;line-height:1.2;}
.fa-body{font-size:15px;color:rgba(255,110,110,0.65);font-family:var(--sans);text-align:center;padding:0 28px;}
.fa-hint{font-size:12px;color:rgba(255,255,255,0.18);font-family:var(--sans);position:absolute;bottom:28px;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
</style>
</head>
<body>
<div class="app-header">
  <h1>▸ timer</h1>
  <div class="header-btns">
    <button class="btn-sm" id="btn-brightness" onclick="toggleBrightnessPanel()" title="明るさ設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <button class="btn-sm" id="btn-wakelock" onclick="toggleWakeLock()" title="画面をオンにし続ける">
      <svg id="wakelock-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;display:none;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/><path d="M19 3v4M21 5h-4"/></svg>
      <svg id="wakelock-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
      <span id="wakelock-label">画面ON</span>
    </button>
    <button class="btn-sm" onclick="exportJSON()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>保存
    </button>
    <button class="btn-sm" onclick="document.getElementById('ii').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>読込
    </button>
    <input id="ii" type="file" accept=".json" style="display:none" onchange="importJSON(event)">
    <button class="btn-sm btn-add" onclick="openAddModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>追加
    </button>
  </div>
</div>
<div id="brightness-panel" style="display:none;background:var(--bg2);border:0.5px solid var(--border2);border-radius:10px;padding:12px 14px;margin-bottom:10px;">
  <div style="font-size:11px;color:var(--text2);margin-bottom:8px;">文字の明るさ</div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:11px;color:var(--text3);">暗</span>
    <input type="range" id="brightness-slider" min="20" max="80" value="45" style="flex:1;accent-color:#6aaaf0;" oninput="applyBrightness(this.value)">
    <span style="font-size:11px;color:var(--text2);">明</span>
  </div>
</div>
<div id="slot-list"></div>

<!-- モーダル -->
<div class="modal-overlay" id="modal">
<div class="modal">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
    <h2 id="modal-title" style="margin:0;">タイマーを追加</h2>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-simple" onclick="setMode('simple')">シンプル</button>
      <button class="mode-btn" id="btn-detail" onclick="setMode('detail')">詳細</button>
    </div>
  </div>
  <div class="form-group">
    <label>タイプ</label>
    <select id="f-type" onchange="onTypeChange()">
      <option value="countdown">残り時間タイマー</option>
      <option value="timealarm">時刻タイマー</option>
      <option value="clock">時計</option>
    </select>
  </div>

  <!-- 残り時間タイマー -->
  <div id="f-countdown-fields">
    <div class="form-group"><label>タイトル</label><input id="f-title" type="text" placeholder="例：会議終了まで"></div>
    <div class="form-group">
      <label>時間（時 : 分 : 秒）</label>
      <div style="display:flex;gap:6px;">
        <input id="f-h" type="number" min="0" max="99" placeholder="0" style="flex:1;">
        <input id="f-m" type="number" min="0" max="59" placeholder="0" style="flex:1;">
        <input id="f-s" type="number" min="0" max="59" placeholder="0" style="flex:1;">
      </div>
    </div>
    <!-- 詳細のみ -->
    <div class="detail-only">
      <div class="form-group"><label>タイマー終了後</label>
        <select id="f-on-end"><option value="reset">リセット（100%に戻る）</option><option value="stay">0のまま残る</option><option value="remove">画面から削除</option></select>
      </div>
      <div class="section-title">開始トリガー</div>
      <div class="form-group"><label>開始方法</label>
        <select id="f-start-trigger" onchange="onStartTriggerChange()">
          <option value="manual">手動（開始ボタン）</option>
          <option value="time">指定時刻</option>
          <option value="timer_any">他のタイマーのうち1つでも終了したとき</option>
          <option value="timer_all">他のタイマーのすべてが終了したとき</option>
          <option value="alarm_stop">他のアラームが止まったとき</option>
          <option value="alarm_start">他のアラームが開始したとき</option>
        </select>
      </div>
      <div id="f-start-time-wrap" class="form-group" style="display:none;"><label>開始時刻</label><input id="f-start-time" type="time"></div>
      <div id="f-start-timers-wrap" class="form-group" style="display:none;"><label>対象タイマー（複数選択可）</label><div id="f-start-timers-cb" style="display:flex;flex-direction:column;gap:6px;margin-top:4px;"></div></div>
      <div id="f-start-alarm-wrap" class="form-group" style="display:none;"><label>対象アラーム</label>
        <select id="f-start-alarm-target"><option value="any">すべてのアラーム（どれでも）</option></select>
      </div>
    </div>
    <div class="section-title">アラーム</div>
    <!-- 詳細のみ -->
    <div class="detail-only">
      <div class="form-group"><label>アラーム表示</label>
        <select id="f-alarm-type" onchange="onAlarmTypeChange()">
          <option value="fullscreen">全画面アラーム</option>
          <option value="blink">タイムバー点滅</option>
          <option value="none">なし</option>
        </select>
      </div>
    </div>
    <!-- 詳細のみ: 残り○秒前アラームリスト -->
    <div class="detail-only">
      <div class="form-group">
        <label>追加のアラームタイミング（残り○秒前）<span style="color:var(--text3);font-size:10px;margin-left:6px;">残り0は常に発火</span></label>
        <div id="alarm-before-list"></div>
        <button class="btn-add-row" onclick="addAlarmBefore()">＋ 残り○秒前を追加</button>
      </div>
    </div>
    <div id="f-fullscreen-wrap">
      <div class="detail-only">
        <div class="form-group"><label>全画面アラームの表示内容</label>
          <select id="f-fa-content"><option value="title">タイトルのみ</option><option value="title_text">タイトル＋テキスト</option><option value="text">テキストのみ</option></select>
        </div>
        <div class="form-group"><label>表示テキスト</label><input id="f-fa-text" type="text" placeholder="例：時間になりました"></div>
      </div>
    </div>
    <!-- 詳細のみ -->
    <div class="detail-only">
      <div class="form-group"><label>アラームの消し方</label>
        <select id="f-alarm-dismiss" onchange="onAlarmDismissChange()">
          <option value="click">クリック（タップ）で消える</option>
          <option value="timeout">指定時間後に自動で消える</option>
          <option value="priority">優先度の高いアラームが出たら消える</option>

<!-- 全画面アラーム -->
<div class="fullscreen-alarm" id="fullscreen-alarm" onclick="dismissFullscreenAlarm()">

  <div class="fa-body" id="fa-body"></div>

<script>
const DAYS=['日','月','火','水','木','金','土'];
let timers=[],editingId=null,dragSrcIdx=null,alarmQueue=[],dismissTimers={},isDragging=false;

/* ── utils ── */
function uid(){return Math.random().toString(36).slice(2,9);}
// ランダム暖色（ダークモード向け・少し明るめ）
function randomWarmColor(){
  // HSL: 暖色系(h=0〜60), s=55〜75%, l=45%固定
  const h=Math.floor(Math.random()*61); // 0〜60度（赤〜黄）
  const s=55+Math.floor(Math.random()*21); // 55〜75%
  const l=45;
  // HSL→HEX変換
  const hsl2hex=(h,s,l)=>{
    s/=100;l/=100;
    const a=s*Math.min(l,1-l);
    const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1);};
    const toHex=x=>Math.round(x*255).toString(16).padStart(2,'0');
    return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));
  };
  return hsl2hex(h,s,l);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hexToRgb(h){return`${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;}

/* ── 保存 ── */
function save(){localStorage.setItem('timers_v3',JSON.stringify(timers));}
function load(){
  try{
    const raw=localStorage.getItem('timers_v3');
    if(!raw){
      // 初回起動時: 1分タイマーと時計をデフォルト表示
      timers=[
        {
          id:uid(),type:'countdown',title:'',total:60,remaining:60,state:'idle',
          onEnd:'reset',startTrigger:'manual',startAt:'',startTimerIds:[],startAlarmTarget:'any',
          alarmType:'fullscreen',alarmBefores:[],faContent:'title',faText:'',
          alarmDismiss:'click',alarmDismissTimeout:10,pausable:true,
          baseColor:'#b85010',thresholds:[],pauseTriggers:[],resumeTriggers:[],
          _alarmFired:false,_endProcessed:false,_alarmFiredBefores:{}
        },
        {
          id:uid(),type:'clock',title:'',fmt:'24',dateFmt:'date-only'
        }
      ];
      return;
    }
    timers=JSON.parse(raw);
    const now=Date.now();
    timers.forEach(t=>{
      // BUG-E修正: 一時フラグをリセット（リロード後に正常動作するように）
      t._alarmFired=false;t._endProcessed=false;t._alarmFiredAt=null;t._alarmFiredBefores={};
      if(t.type==='timealarm'){
        t._alarmTotal=null;
        if(t.state==='done')t.state='running'; // 翌日も発火できるように
        if(!t.nextAlarmTime) t.nextAlarmTime = now + alarmRem(t.alarmAt) * 1000;
      }
      if(t.type==='countdown'&&(t.state==='running'||(t.state==='alarm'&&t.alarmTiming==='before'&&t.remaining>0))){
      // CHECK-2修正: alarmTiming=beforeの場合、アラーム中もカウントを継続する
        if(!t.endTime) t.endTime = now + t.remaining * 1000;
        t.remaining=Math.max(0,Math.ceil((t.endTime-now)/1000));
      }
    });
    // BUG-6修正: リロード後にfullscreenアラームを復元
    timers.forEach(t=>{
      if(t.state==='alarm'&&t.alarmType==='fullscreen'&&!alarmQueue.includes(t.id)){
        alarmQueue.push(t.id);
      }
    });
  }catch(e){timers=[];}
}
function exportJSON(){
  const b=new Blob([JSON.stringify(timers,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='timers.json';a.click();
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{timers=JSON.parse(ev.target.result);save();render();}catch{alert('読み込みに失敗しました');}};
  r.readAsText(f);e.target.value='';
}

/* ── カラー ── */
function getColor(t,rem){
  const r=rem!=null?rem:(t.remaining||0);
  const sorted=[...(t.thresholds||[])].sort((a,b)=>b.secs-a.secs);
  for(const th of sorted){if(r<=th.secs)return th.color;}
  return t.baseColor||'#4a8a5a';
}

/* ── 時刻タイマー残り ── */
function alarmRem(at){
  const now=new Date();
  const[ah,am]=at.split(':').map(Number);
  let tgt=new Date(now);tgt.setHours(ah,am,0,0);
  if(tgt<=now)tgt.setDate(tgt.getDate()+1);
  return Math.max(0,Math.floor((tgt-now)/1000));
}
function alarmTotal(t){
  if(!t._alarmTotal||t._alarmTotal<1)t._alarmTotal=alarmRem(t.alarmAt)||86400;
  return t._alarmTotal;
}

/* ── 時計フォーマット ── */
function fmtClock(now,fmt,dateFmt){
  const h24=now.getHours(),mi=now.getMinutes(),sc=now.getSeconds();
  let ts;
  if(fmt==='12'){const ap=h24<12?'AM':'PM';const h=h24%12||12;ts=`${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}:${String(sc).padStart(2,'0')} ${ap}`;}
  else ts=`${String(h24).padStart(2,'0')}:${String(mi).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
  const day=DAYS[now.getDay()],y=now.getFullYear(),mo=String(now.getMonth()+1).padStart(2,'0'),d=String(now.getDate()).padStart(2,'0');
  let ds='';
  if(dateFmt==='weekday-date')ds=`${day} ${y}/${mo}/${d}`;
  else if(dateFmt==='date-only')ds=`${y}/${mo}/${d}`;
  else if(dateFmt==='weekday-only')ds=`${day}曜日`;
  return{ts,ds};
}

/* ── 循環参照 ── */
function hasCycle(allTimers,newT){
  const deps={};
  allTimers.forEach(t=>{
    if(t.id===newT.id)return;
    if(t.startTrigger==='timer_any'||t.startTrigger==='timer_all')deps[t.id]=t.startTimerIds||[];
  });
  if(newT.startTrigger==='timer_any'||newT.startTrigger==='timer_all')deps[newT.id]=newT.startTimerIds||[];
  function visit(id,seen){if(seen.has(id))return true;seen.add(id);return(deps[id]||[]).some(d=>visit(d,seen));}
  return Object.keys(deps).some(id=>visit(id,new Set()));
}

/* ── モーダル ── */
function openAddModal(){editingId=null;document.getElementById('modal-title').textContent='タイマーを追加';document.getElementById('btn-delete').style.display='none';resetForm();setMode('simple');populateSels();document.getElementById('modal').classList.add('open');}
function openEditModal(id){
  editingId=id;const t=timers.find(x=>x.id===id);if(!t)return;
  document.getElementById('modal-title').textContent='タイマーを編集';
  document.getElementById('btn-delete').style.display='block';
  resetForm();populateSels(id);
  document.getElementById('f-type').value=t.type;onTypeChange();
  if(t.type==='countdown'){
    V('f-title',t.title);V('f-h',Math.floor(t.total/3600));V('f-m',Math.floor((t.total%3600)/60));V('f-s',t.total%60);
    V('f-on-end',t.onEnd||'reset');V('f-start-trigger',t.startTrigger||'manual');
    V('f-start-time',t.startAt||'');V('f-alarm-type',t.alarmType||'fullscreen');
    V('f-fa-content',t.faContent||'title');V('f-fa-text',t.faText||'');
    V('f-alarm-dismiss',t.alarmDismiss||'click');V('f-dismiss-timeout',t.alarmDismissTimeout||10);
    V('f-pausable',t.pausable?'1':'0');
    V('f-base-color',t.baseColor||'#2a5c3a');V('f-base-color-text',t.baseColor||'#2a5c3a');
    (t.thresholds||[]).forEach(th=>addThreshold('',th.secs,th.color));
    (t.alarmBefores||[]).forEach(s=>addAlarmBefore(s));
    (t.startTimerIds||[]).forEach(tid=>{
      const cb=document.querySelector(`#f-start-timers-cb input[value="${tid}"]`);
      if(cb)cb.checked=true;
    });
    const asel=document.getElementById('f-start-alarm-target');
    if(t.startAlarmTarget)for(const o of asel.options)if(o.value===t.startAlarmTarget)o.selected=true;
    (t.pauseTriggers||[]).forEach(tr=>addTriggerRow('pause',tr));
    (t.resumeTriggers||[]).forEach(tr=>addTriggerRow('resume',tr));
    onStartTriggerChange();onAlarmTypeChange();onAlarmDismissChange();
    // 詳細モードで開く（既存タイマーの編集は詳細設定が見えるように）
    if(t.startTrigger!=='manual'||t.onEnd!=='reset'||(t.alarmBefores&&t.alarmBefores.length>0)||(t.thresholds&&t.thresholds.length>0)){setMode('detail');}else{setMode('simple');}
  }else if(t.type==='timealarm'){
    V('f-ta-title',t.title);V('f-ta-time',t.alarmAt||'');V('f-ta-alarm-type',t.alarmType||'fullscreen');
    V('f-ta-fa-content',t.faContent||'title');V('f-ta-fa-text',t.faText||'');
    V('f-ta-dismiss',t.alarmDismiss||'click');V('f-ta-dismiss-timeout',t.alarmDismissTimeout||10);
    V('f-ta-color',t.baseColor||'#185FA5');V('f-ta-color-text',t.baseColor||'#185FA5');
    (t.thresholds||[]).forEach(th=>addThreshold('ta',th.secs,th.color));
    onTaAlarmTypeChange();onTaDismissChange();
  }else if(t.type==='clock'){
    V('f-clock-title',t.title||'');V('f-clock-fmt',t.fmt||'24');V('f-clock-date',t.dateFmt||'weekday-date');
  }
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}
function V(id,val){const el=document.getElementById(id);if(el)el.value=val;}

function timerLabel(t){
  // タイトルがない場合は「（タイプ、時間）」形式
  if(t.title)return t.title;
  if(t.type==='countdown'){
    const h=Math.floor(t.total/3600),m=Math.floor((t.total%3600)/60),s=t.total%60;
    let timeStr=h>0?`${h}時間`:''+(m>0?`${m}分`:''+(s>0?`${s}秒`:''));
    if(!timeStr)timeStr=`${t.total}秒`;
    return `無題（残り時間タイマー、${timeStr}）`;
  }
  if(t.type==='timealarm')return `無題（時刻タイマー、${t.alarmAt||'?'}）`;
  return `無題（時計）`;
}
function populateSels(excId){
  const cbWrap=document.getElementById('f-start-timers-cb');
  const asel=document.getElementById('f-start-alarm-target');
  cbWrap.innerHTML='';
  asel.innerHTML='<option value="any">すべてのアラーム（どれでも）</option>';
  timers.forEach(t=>{
    if(t.id===excId||t.type==='clock')return;
    // チェックボックス生成
    const label=document.createElement('label');
    label.style.cssText='display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;padding:4px 0;';
    const cb=document.createElement('input');
    cb.type='checkbox';cb.value=t.id;cb.dataset.timerId=t.id;
    cb.style.cssText='width:15px;height:15px;accent-color:#6aaaf0;cursor:pointer;flex-shrink:0;';
    label.appendChild(cb);
    label.appendChild(document.createTextNode(timerLabel(t)));
    cbWrap.appendChild(label);
    // アラーム対象セレクトには全タイマー追加
    const o=document.createElement('option');o.value=t.id;o.textContent=timerLabel(t);asel.appendChild(o);
  });
}

function resetForm(){
  ['f-title','f-h','f-m','f-s'].forEach(id=>V(id,''));
  V('f-h','0');V('f-m','5');V('f-s','0');
  V('f-on-end','reset');V('f-start-trigger','manual');V('f-start-time','');
  V('f-alarm-type','fullscreen');
  V('f-fa-content','title');V('f-fa-text','');V('f-alarm-dismiss','click');V('f-dismiss-timeout','10');
  V('f-pausable','1');const _rc=randomWarmColor();V('f-base-color',_rc);V('f-base-color-text',_rc);
  V('f-ta-title','');V('f-ta-time','');V('f-ta-alarm-type','fullscreen');
  V('f-ta-fa-content','title');V('f-ta-fa-text','');V('f-ta-dismiss','click');V('f-ta-dismiss-timeout','10');
  V('f-ta-color','#185FA5');V('f-ta-color-text','#185FA5');
  V('f-clock-title','');V('f-clock-fmt','24');V('f-clock-date','date-only');
  V('f-type','countdown');
  ['threshold-list','ta-threshold-list','pause-trigger-list','resume-trigger-list','alarm-before-list'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='';});
  onTypeChange();onStartTriggerChange();onAlarmTypeChange();onAlarmDismissChange();
  setMode('simple');
}
function show(id,v){document.getElementById(id).style.display=v?'':'none';}
function onTypeChange(){const v=document.getElementById('f-type').value;show('f-countdown-fields',v==='countdown');show('f-timealarm-fields',v==='timealarm');show('f-clock-fields',v==='clock');}
function onStartTriggerChange(){const v=document.getElementById('f-start-trigger').value;show('f-start-time-wrap',v==='time');show('f-start-timers-wrap',v==='timer_any'||v==='timer_all');show('f-start-alarm-wrap',v==='alarm_stop'||v==='alarm_start');}
function onAlarmTypeChange(){
  const at=document.getElementById('f-alarm-type').value;
  show('f-fullscreen-wrap',at==='fullscreen');
}
function onAlarmDismissChange(){show('f-dismiss-timeout-wrap',document.getElementById('f-alarm-dismiss').value==='timeout');}
function onTaAlarmTypeChange(){show('f-ta-fullscreen-wrap',document.getElementById('f-ta-alarm-type').value==='fullscreen');}
function onTaDismissChange(){show('f-ta-dismiss-timeout-wrap',document.getElementById('f-ta-dismiss').value==='timeout');}
// シンプル/詳細モード切替
let currentMode='simple';
function setMode(mode){
  currentMode=mode;
  const modal=document.querySelector('.modal');
  modal.classList.toggle('detail-mode',mode==='detail');
  document.getElementById('btn-simple').classList.toggle('active',mode==='simple');
  document.getElementById('btn-detail').classList.toggle('active',mode==='detail');
}
// 残り○秒前アラームの追加
function addAlarmBefore(secs=300){
  const row=document.createElement('div');row.className='threshold-row';
  row.innerHTML=`<span style="font-size:11px;color:var(--text2);white-space:nowrap;">残り</span><input type="number" min="1" value="${secs}" style="flex:1;max-width:80px;"><span style="font-size:11px;color:var(--text2);white-space:nowrap;">秒前</span><button class="btn-remove-row" onclick="this.parentElement.remove()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  document.getElementById('alarm-before-list').appendChild(row);
}
function collectAlarmBefores(){
  return Array.from(document.querySelectorAll('#alarm-before-list .threshold-row input[type="number"]')).map(i=>parseInt(i.value)||0).filter(v=>v>0);
}
function syncCI(cid,tid){const v=document.getElementById(tid).value;if(/^#[0-9a-fA-F]{6}$/.test(v))document.getElementById(cid).value=v;}
document.getElementById('f-base-color').addEventListener('input',e=>V('f-base-color-text',e.target.value));

function addThreshold(pfx='',secs=300,color='#c09030'){
  const lid=pfx==='ta'?'ta-threshold-list':'threshold-list';
  const row=document.createElement('div');row.className='threshold-row';
  row.innerHTML=`<input type="number" min="0" value="${secs}" style="flex:1;max-width:80px;"><span style="font-size:11px;color:var(--text2);white-space:nowrap;">秒を切ったら</span><input type="color" value="${color}"><input type="text" value="${color}" style="max-width:90px;" oninput="syncTH(this)"><button class="btn-remove-row" onclick="this.parentElement.remove()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  const ci=row.querySelector('input[type="color"]'),ti=row.querySelectorAll('input[type="text"]')[0];

function syncTH(el){if(/^#[0-9a-fA-F]{6}$/.test(el.value))el.previousElementSibling.value=el.value;}

function addTriggerRow(kind,data={}){
  const lid=kind==='pause'?'pause-trigger-list':'resume-trigger-list';
  const row=document.createElement('div');row.className='trigger-row';
  row.innerHTML=`<div class="trigger-row-top"><select class="trigger-cond-select" style="flex:1;"><option value="alarm_stop">他のアラームが止まったとき</option><option value="alarm_start">他のアラームが開始したとき</option><option value="pause_start">他のタイマーが一時停止したとき</option><option value="pause_stop">他のタイマーが再開したとき</option></select><button class="btn-remove-row" onclick="this.closest('.trigger-row').remove()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="trigger-sub"><span style="font-size:11px;color:var(--text2);white-space:nowrap;">対象：</span><select class="trigger-target-select" style="flex:1;"><option value="any">すべて</option></select></div>`;
  row.querySelector('.trigger-cond-select').value=data.cond||'alarm_stop';
  const ts=row.querySelector('.trigger-target-select');
  timers.forEach(t=>{if(t.id===editingId||t.type==='clock')return;const o=document.createElement('option');o.value=t.id;o.textContent=t.title||t.id;ts.appendChild(o);});
  ts.value=data.target||'any';

function collectTH(lid){
  return Array.from(document.querySelectorAll(`#${lid} .threshold-row`)).map(r=>{const ins=r.querySelectorAll('input');return{secs:parseInt(ins[0].value)||0,color:ins[1].value};}).sort((a,b)=>b.secs-a.secs);
}
function collectTR(lid){
  return Array.from(document.querySelectorAll(`#${lid} .trigger-row`)).map(r=>({cond:r.querySelector('.trigger-cond-select').value,target:r.querySelector('.trigger-target-select').value}));
}
function collectMS(sid){
  // f-start-timers-cbのチェックボックスから収集
  return Array.from(document.querySelectorAll('#f-start-timers-cb input[type="checkbox"]:checked')).map(cb=>cb.value);
}

function saveTimer(){
  const type=document.getElementById('f-type').value;
  let timer;
  if(type==='countdown'){
    const h=parseInt(document.getElementById('f-h').value)||0,m=parseInt(document.getElementById('f-m').value)||0,s=parseInt(document.getElementById('f-s').value)||0;
    const total=h*3600+m*60+s;
    if(total<=0){alert('時間を設定してください');return;}
    // シンプルモードでは非表示フィールドのデフォルト値を使う
    const isDetail=currentMode==='detail';
    const st=isDetail?document.getElementById('f-start-trigger').value:'manual';
    const stids=isDetail?collectMS('f-start-timers'):[];
    const cand={id:editingId||'__new__',startTrigger:st,startTimerIds:stids};
    if((st==='timer_any'||st==='timer_all')&&hasCycle([...timers.filter(t=>t.id!==editingId),cand],cand)){alert('循環参照が検出されました');return;}
    const prev=timers.find(t=>t.id===editingId);
    timer={id:editingId||uid(),type:'countdown',title:document.getElementById('f-title').value||'',total,remaining:prev?.remaining??total,state:prev?.state??'idle',
      onEnd:isDetail?document.getElementById('f-on-end').value:'reset',
      startTrigger:st,startAt:isDetail?document.getElementById('f-start-time').value:'',startTimerIds:stids,
      startAlarmTarget:isDetail?document.getElementById('f-start-alarm-target').value:'any',
      alarmType:document.getElementById('f-alarm-type').value,
      alarmBefores:isDetail?collectAlarmBefores():[],
      faContent:isDetail?document.getElementById('f-fa-content').value:'title',
      faText:isDetail?document.getElementById('f-fa-text').value:'',
      alarmDismiss:isDetail?document.getElementById('f-alarm-dismiss').value:'click',
      alarmDismissTimeout:isDetail?(parseInt(document.getElementById('f-dismiss-timeout').value)||10):10,
      pausable:isDetail?document.getElementById('f-pausable').value==='1':true,
      baseColor:document.getElementById('f-base-color').value,
      thresholds:isDetail?collectTH('threshold-list'):[],
      pauseTriggers:isDetail?collectTR('pause-trigger-list'):[],
      resumeTriggers:isDetail?collectTR('resume-trigger-list'):[]};
  }else if(type==='timealarm'){
    const at=document.getElementById('f-ta-time').value;if(!at){alert('時刻を設定してください');return;}
    const prev=timers.find(t=>t.id===editingId);
    timer={id:editingId||uid(),type:'timealarm',title:document.getElementById('f-ta-title').value||'',alarmAt:at,
      alarmType:document.getElementById('f-ta-alarm-type').value,faContent:document.getElementById('f-ta-fa-content').value,faText:document.getElementById('f-ta-fa-text').value,
      alarmDismiss:document.getElementById('f-ta-dismiss').value,alarmDismissTimeout:parseInt(document.getElementById('f-ta-dismiss-timeout').value)||10,
      baseColor:document.getElementById('f-ta-color').value,thresholds:collectTH('ta-threshold-list'),
      state:prev?.state??'running',_alarmTotal:null};
    timer.nextAlarmTime = Date.now() + alarmRem(at) * 1000;
  }else{
    const clkIsDetail=currentMode==='detail';
    timer={id:editingId||uid(),type:'clock',title:document.getElementById('f-clock-title').value||'',fmt:clkIsDetail?document.getElementById('f-clock-fmt').value:'24',dateFmt:clkIsDetail?document.getElementById('f-clock-date').value:'date-only'};
  }
  if(editingId){const i=timers.findIndex(t=>t.id===editingId);if(i>=0)timers[i]=timer;}else timers.push(timer);
  save();render();closeModal();
}

function showDeleteConfirm(id){

function execDelete(){

function deleteTimerById(id){timers=timers.filter(t=>t.id!==id);alarmQueue=alarmQueue.filter(x=>x!==id);if(window._preAlarms)Object.keys(window._preAlarms).filter(k=>k.startsWith(id+'_pre_')).forEach(k=>delete window._preAlarms[k]);clearDismiss(id);save();render();}
function deleteTimer(){if(!editingId)return;deleteTimerById(editingId);closeModal();}

/* ── タイマー操作 ── */
function startTimer(id, baseStartTime){
  const t=timers.find(x=>x.id===id);
  if(!t||t.type==='clock'||t.type==='timealarm')return; // BUG-F修正: countdown以外は開始不可
  t.state='running';
  t.resumedAt=Date.now();
  t._alarmFired=false;
  t._endProcessed=false;
  t._alarmFiredBefores={};
  if(t.remaining===0||t.remaining==null)t.remaining=t.total;
  const startMs=baseStartTime||Date.now();
  t.endTime=startMs+t.remaining*1000;
  t.remaining=Math.max(0,Math.ceil((t.endTime-Date.now())/1000));
  if(t.remaining===0){
    if(t.alarmType!=='none'){
      triggerAlarm(t);
      checkTimerEndTriggers(t.id,t.endTime);
    }else if(!t._endProcessed){
      t._endProcessed=true;
      checkTimerEndTriggers(t.id,t.endTime);
      if(t.onEnd==='reset'){
        t.remaining=t.total;
        t.state='idle';
        t._alarmFiredBefores={};
      }else if(t.onEnd==='remove'){
        timers=timers.filter(x=>x.id!==t.id);
      }else{
        t.state='done';
      }
    }
  }
  save();
  render();
}
function pauseTimer(id){
  const t=timers.find(x=>x.id===id);
  if(!t||!t.pausable||t.state!=='running')return;
  t.state='paused';
  t.remaining=Math.max(0,Math.ceil((t.endTime-Date.now())/1000));
  save();
  render();
  checkTriggers('pause_start',id);
}
function resumeTimer(id){
  const t=timers.find(x=>x.id===id);
  if(!t||t.state!=='paused')return;
  t.state='running';
  t.resumedAt=Date.now();
  t.endTime=Date.now()+t.remaining*1000;
  save();
  render();
  checkTriggers('pause_stop',id);
}
function resetTimer(id){
  const t=timers.find(x=>x.id===id);
  if(!t)return;
  if(t.type==='countdown'){
    t.remaining=t.total;
    t.state='idle';
    t._alarmFired=false;
    t._endProcessed=false;
    t._alarmFiredBefores={};
    t.endTime=null;
  }
  clearDismiss(id);
  save();
  render();
}

/* ── アラーム ── */
// 残り○秒前の予告アラーム（stateは変えず、fullscreenキューに積むだけ）
function triggerAlarmAt(t,secs){
  const preId=t.id+'_pre_'+secs;
  if(t.alarmType==='fullscreen'){
    // 予告アラーム用の仮エントリをqueueに積む（本体タイマーと区別するためpreIdを使用）
    if(!alarmQueue.includes(preId)){
      // 予告アラームはtimers配列に追加せず、queueと一時マップで管理
      if(!window._preAlarms)window._preAlarms={};
      window._preAlarms[preId]={title:t.title,faContent:t.faContent||'title',faText:t.faText||'',alarmDismiss:'click',alarmDismissTimeout:0,_isPreAlarm:true};
      alarmQueue.push(preId);showNextAlarm();
    }
  }else if(t.alarmType==='blink'){
    // 点滅は一時的にblinkクラスを付ける（3秒後に外す）
    const el=document.querySelector('[data-id="'+t.id+'"]');
    if(el){el.classList.add('pre-alarm-blink');setTimeout(()=>el.classList.remove('pre-alarm-blink'),3000);}
  }
}
function triggerAlarm(t){
  if(t._alarmFired)return;t._alarmFired=true;t.state='alarm';t._alarmFiredAt=Date.now();
  if(t.alarmType==='fullscreen'){if(!alarmQueue.includes(t.id))alarmQueue.push(t.id);showNextAlarm();}
  checkTriggers('alarm_start',t.id);save();render();
  scheduleAutoDismiss(t);
}
function dismissAlarmInt(id,silent=false){
  const t=timers.find(x=>x.id===id);if(!t)return;
  const was=t.state==='alarm';
  clearDismiss(id);
  if(was){
    // timealarmはリセット・削除しない（翌日また発火する）
    if(t.type==='timealarm'){
      t.state='running';t._alarmFired=false;t._alarmTotal=null; // BUG-B修正: 翌日も発火できるようrunningに戻す
      t.nextAlarmTime = Date.now() + alarmRem(t.alarmAt) * 1000;
    }else if(t.onEnd==='remove'){
      timers=timers.filter(x=>x.id!==id);
      alarmQueue=alarmQueue.filter(x=>x!==id);
      if(!silent)checkTriggers('alarm_stop',id);
      if(!silent)showNextAlarm();
      save();render();return;
    }else if(t.onEnd==='reset'){
      t.remaining=t.total;t.state='idle';t._alarmFired=false;
    }else{
      t.state='done';
    }
  }
  t._alarmFired=false;
  alarmQueue=alarmQueue.filter(x=>x!==id);
  if(!silent&&was){checkTriggers('alarm_stop',id);showNextAlarm();}
  save();render();
}
function dismissAlarm(id){dismissAlarmInt(id,false);}
function clearDismiss(id){if(dismissTimers[id]){clearTimeout(dismissTimers[id]);delete dismissTimers[id];}}
function scheduleAutoDismiss(t){
  if(t.alarmDismiss==='timeout'&&t.alarmDismissTimeout>0&&!dismissTimers[t.id]){
    dismissTimers[t.id]=setTimeout(()=>{delete dismissTimers[t.id];dismissAlarmInt(t.id,false);},t.alarmDismissTimeout*1000);
  }
}

/* ── トリガー処理 ── */
// event: 'alarm_stop' | 'alarm_start' | 'pause_start' | 'pause_stop'
function checkTriggers(event,srcId){
  // forEachループ中の配列変更を避けるためスナップショットで処理
  const snapshot=[...timers];
  snapshot.forEach(t=>{
    if(t.type!=='countdown')return;
    // 開始トリガー（alarm系のみ対象）
    if((t.state==='idle'||t.state==='done')&&(
      (t.startTrigger==='alarm_stop'&&event==='alarm_stop')||
      (t.startTrigger==='alarm_start'&&event==='alarm_start')
    )){
      const tgt=t.startAlarmTarget;if(tgt==='any'||tgt===srcId)startTimer(t.id);
    }
    // 一時停止トリガー（alarm系 + pause系）
    if(t.state==='running'&&t.pausable)(t.pauseTriggers||[]).forEach(tr=>{if(tr.cond===event&&(tr.target==='any'||tr.target===srcId))pauseTimer(t.id);});
    // 再開トリガー
    if(t.state==='paused')(t.resumeTriggers||[]).forEach(tr=>{if(tr.cond===event&&(tr.target==='any'||tr.target===srcId))resumeTimer(t.id);});
  });
}
function checkTimerEndTriggers(finId, finEndTime){
  const snapshot=[...timers];
  snapshot.forEach(t=>{
    if(t.type!=='countdown'||(t.state!=='idle'&&t.state!=='done'))return;
    if(t.startTrigger==='timer_any'&&(t.startTimerIds||[]).includes(finId)){
      startTimer(t.id, finEndTime);
    }
    if(t.startTrigger==='timer_all'){
      const ids=t.startTimerIds||[];
      if(ids.length>0&&ids.every(id=>{
        if(id===finId)return true; // 今まさに終了したタイマーは「終了済み」とみなす
        const o=timers.find(x=>x.id===id);
        return!o||['done','alarm','idle'].includes(o.state);
      })){
        const baseStartTime=Math.max(...ids.map(id=>(id===finId?finEndTime:(timers.find(x=>x.id===id)?.endTime||0))));
        startTimer(t.id, baseStartTime);
      }
    }
  });
}

/* ── 全画面アラーム ── */
function buildFaContent(t){
  const fc=t.faContent||'title';
  const rawTitle=(fc==='title'||fc==='title_text')?t.title||'':'';
  const title=rawTitle||'時間になりました';
  const body=(fc==='title_text'||fc==='text')?t.faText||'':'';
  return{title,body};
}
function hexDarken(hex,pct){
  // hexカラーをpct%暗くする（背景点滅用）
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.round(r*(1-pct));g=Math.round(g*(1-pct));b=Math.round(b*(1-pct));
  return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}
function setFaBg(baseColor){
  const fa=document.getElementById('fullscreen-alarm');
  const c1=baseColor||'#4a1a0a';
  const c2=hexDarken(c1,0.35);
  // CSS custom propertyでアニメーション色を切り替える
  fa.style.setProperty('--fa-c1',c1);
  fa.style.setProperty('--fa-c2',c2);
}
function showNextAlarm(){
  const fa=document.getElementById('fullscreen-alarm');
  if(fa.classList.contains('open'))return;
  while(alarmQueue.length){
    const id=alarmQueue[0];
    const pre=(window._preAlarms||{})[id];
    if(pre){
      document.getElementById('fa-title').textContent=pre.title||'時間になりました';
      document.getElementById('fa-body').textContent=pre.faText||'';
      setFaBg(pre.baseColor||null);
      fa.classList.add('open');return;
    }
    const t=timers.find(x=>x.id===id);
    if(!t){alarmQueue.shift();continue;}
    const{title,body}=buildFaContent(t);
    document.getElementById('fa-title').textContent=title;
    document.getElementById('fa-body').textContent=body;
    setFaBg(t.baseColor||null);
    fa.classList.add('open');return;
  }
}
function dismissFullscreenAlarm(){
  document.getElementById('fullscreen-alarm').classList.remove('open');
  if(alarmQueue.length){
    const id=alarmQueue.shift();
    // 予告アラームは消すだけ
    if(window._preAlarms&&window._preAlarms[id]){delete window._preAlarms[id];setTimeout(showNextAlarm,120);return;}
    const t=timers.find(x=>x.id===id);
    if(t){dismissAlarmInt(id,false);}
    else{
      // BUG-D修正: タイマーが削除済みでもalarm_stopトリガーを発火
      checkTriggers('alarm_stop',id);
      showNextAlarm();
    }
  }
  setTimeout(showNextAlarm,120);
}

/* ── レンダリング ── */
function render(){
  if(isDragging)return; // BUG-I修正: ドラッグ中はDOM再構築しない
  const list=document.getElementById('slot-list');list.innerHTML='';
  const now=new Date();
  timers.forEach((t,idx)=>{
    if(t.type==='clock'){
      const{ts,ds}=fmtClock(now,t.fmt,t.dateFmt);
      const el=document.createElement('div');el.className='clock-slot';el.dataset.id=t.id;
      el.innerHTML=`<div class="clock-track"></div><div class="drag-handle"><div class="drag-handle-dots"><span></span><span></span><span></span><span></span><span></span><span></span></div></div><div class="clock-inner">${ds?`<span class="clock-date">${esc(ds)}</span>`:''}<span class="clock-time-display" id="clock-${t.id}">${esc(ts)}</span></div><div class="clock-btns"><div class="slot-sub-btn" onclick="openEditModal('${t.id}')" title="設定">${iSettings()}</div><div class="slot-del-btn" onclick="confirmDeleteTimer('${t.id}')" title="削除">${iTrash()}</div></div>`;
      makeDraggable(el);list.appendChild(el);return;
    }
    const isTA=t.type==='timealarm';
    const rem=isTA?alarmRem(t.alarmAt):t.remaining;
    const total=isTA?alarmTotal(t):t.total;
    const fillPct=total>0?Math.min(100,Math.max(0,(1-rem/total)*100)):0;
    const color=getColor(t,rem);const rgb=hexToRgb(color);
    const isAlarm=t.state==='alarm',isRunning=t.state==='running',isPaused=t.state==='paused',isDone=t.state==='done';
    let sc='s-waiting',badge='待機中';
    if(isAlarm){sc='s-alarm';badge='アラーム中';}
    else if(isRunning){sc='s-running';badge='実行中';}
    else if(isPaused){sc='s-paused';badge='一時停止';}
    else if(isDone){sc='s-done';badge='終了';}
    const blinkMode=isAlarm&&t.alarmType==='blink'?'blink-mode':'';
    const canStart=t.state==='idle'||isDone,canPause=t.pausable&&isRunning,canResume=t.pausable&&isPaused;
    let mainBtn='';
    if(canStart)mainBtn=`<div class="slot-main-btn" onclick="startTimer('${t.id}')" title="開始">${iPlay()}</div>`;
    else if(canPause)mainBtn=`<div class="slot-main-btn" onclick="pauseTimer('${t.id}')" title="一時停止">${iPause()}</div>`;
    else if(canResume)mainBtn=`<div class="slot-main-btn" onclick="resumeTimer('${t.id}')" title="再開">${iPlay()}</div>`;
    else if(isAlarm)mainBtn=`<div class="slot-main-btn" onclick="dismissAlarm('${t.id}')" title="アラーム消去" style="border-color:rgba(255,80,80,0.3);color:rgba(255,120,120,0.8);">${iX()}</div>`;
    else mainBtn=`<div style="width:40px;"></div>`;
    const el=document.createElement('div');
    el.className=`slot ${sc} ${blinkMode}`;el.dataset.id=t.id;
    el.style.cssText=`--c-time:${color};`;
    el.innerHTML=`
      <div class="slot-track"></div>
      <div class="slot-fill${fillPct>=99.5?' full':''}" style="width:${fillPct}%;background:rgba(${rgb},0.22);"></div>
      <div class="drag-handle"><div class="drag-handle-dots"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
      <div class="slot-inner">
        <div class="slot-left">
          <div class="slot-name-row">
            <span class="slot-badge">${badge}</span>
            <span class="slot-name">${esc(t.title)}</span>
          </div>
          <div class="slot-time" id="time-${t.id}" style="color:${color};">${fmtTime(rem)}</div>
          ${isTA?`<div class="slot-meta">${esc(t.alarmAt)} にアラーム</div>`:''}
        </div>
        <div class="slot-right">
          ${mainBtn}
          ${!isTA?`<div class="slot-sub-btn" onclick="resetTimer('${t.id}')" title="リセット">${iRefresh()}</div>`:''}
          <div class="slot-sub-btn" onclick="openEditModal('${t.id}')" title="設定">${iSettings()}</div>
          <div class="slot-del-btn" onclick="confirmDeleteTimer('${t.id}')" title="削除">${iTrash()}</div>
        </div>
      </div>`;
    makeDraggable(el);list.appendChild(el);
  });
}

/* ── アイコン ── */

/* ── ドラッグ&ドロップ（自前実装・ハンドル専用） ── */
let _dragId=null;

function _dndGetSlots(){return Array.from(document.querySelectorAll('.slot,.clock-slot'));}
function _dndFindTarget(y){
  return _dndGetSlots().find(s=>{const r=s.getBoundingClientRect();return y>=r.top&&y<=r.bottom;})||null;
}
function _dndSwap(srcId,tgtEl){
  if(!srcId||!tgtEl)return;
  const tgtId=tgtEl.dataset.id;
  if(!tgtId||tgtId===srcId)return;
  const si=timers.findIndex(t=>t.id===srcId);
  const ti=timers.findIndex(t=>t.id===tgtId);
  if(si<0||ti<0)return;
  const mv=timers.splice(si,1)[0];
  timers.splice(ti,0,mv);
  save();render();
}
function _dndClear(){_dndGetSlots().forEach(s=>s.classList.remove('drag-over'));}

function makeDraggable(el){
  // idx引数は使わない（_dndSwapがtimers配列を都度検索する）
  const handle=el.querySelector('.drag-handle');
  if(!handle)return;

  // ── PC: mousedown on handle ──
  handle.addEventListener('mousedown',function(e){
    if(e.button!==0)return;
    e.preventDefault(); // テキスト選択防止のみ、stopPropagationはしない
    const startX=e.clientX,startY=e.clientY;
    const THRESHOLD=6; // px: この距離を超えたらドラッグ開始
    let dragging=false;

    function onMove(ev){
      if(!dragging){
        // 移動距離がしきい値を超えたらドラッグ開始
        if(Math.abs(ev.clientX-startX)>THRESHOLD||Math.abs(ev.clientY-startY)>THRESHOLD){
          dragging=true;
          _dragId=el.dataset.id;
          isDragging=true;
          el.classList.add('dragging');
        }else return;
      }
      _dndClear();
      const tgt=_dndFindTarget(ev.clientY);
      if(tgt&&tgt.dataset.id!==_dragId)tgt.classList.add('drag-over');
    }
    function onUp(ev){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      if(dragging){
        el.classList.remove('dragging');
        _dndClear();
        const tgt=_dndFindTarget(ev.clientY);
        const sid=_dragId;
        _dragId=null;
        isDragging=false;
        _dndSwap(sid,tgt);
      }
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  // ── スマホ: touchstart/move/end on handle ──
  let _touchMoved=false;
  handle.addEventListener('touchstart',function(e){
    _dragId=el.dataset.id;
    _touchMoved=false;
    el.classList.add('dragging');
  },{passive:true});
  handle.addEventListener('touchmove',function(e){
    e.preventDefault();
    _touchMoved=true;
    isDragging=true;
    _dndClear();
    const tgt=_dndFindTarget(e.touches[0].clientY);
    if(tgt&&tgt.dataset.id!==_dragId)tgt.classList.add('drag-over');
  },{passive:false});
  handle.addEventListener('touchend',function(e){
    el.classList.remove('dragging');
    _dndClear();
    if(_touchMoved){
      const tgt=_dndFindTarget(e.changedTouches[0].clientY);
      const sid=_dragId;
      _dragId=null;
      isDragging=false;
      _dndSwap(sid,tgt);
    } else {
      _dragId=null;
      isDragging=false;
    }
    _touchMoved=false;
  });
}

/* ── 指定時刻開始 ── */
function checkTimeTriggers(now){
  timers.forEach(t=>{
    if(t.type!=='countdown'||t.startTrigger!=='time'||(t.state!=='idle'&&t.state!=='done')||!t.startAt)return;
    const[ah,am]=t.startAt.split(':').map(Number);
    if(now.getHours()===ah&&now.getMinutes()===am&&now.getSeconds()===0)startTimer(t.id);
  });
}

/* ── ティック ── */
function tick(){
  const now=new Date();let nR=false;
  checkTimeTriggers(now);
  // BUG2修正: forEach中にtimers配列を置き換えると壊れるのでスナップショット使用
  const snapshot=[...timers];
  snapshot.forEach(t=>{
    if(t.type==='clock'){
      const{ts,ds}=fmtClock(now,t.fmt,t.dateFmt);
      const el=document.getElementById(`clock-${t.id}`);if(el)el.textContent=ts;
      const de=el?.closest('.clock-slot')?.querySelector('.clock-date');if(de)de.textContent=ds;
      return;
    }
    if(t.type==='timealarm'){
      if(!t.nextAlarmTime){
        t.nextAlarmTime = Date.now() + alarmRem(t.alarmAt) * 1000;
      }
      const rem=Math.max(0, Math.floor((t.nextAlarmTime - Date.now()) / 1000));
      const el=document.getElementById(`time-${t.id}`);
      if(el){
        el.textContent=fmtTime(rem);const color=getColor(t,rem);el.style.color=color;
        const fill=el?.closest('.slot')?.querySelector('.slot-fill');
        if(fill){const tot=alarmTotal(t);const pct=(1-rem/tot)*100;fill.style.width=`${Math.min(100,Math.max(0,pct))}%`;fill.style.background=`rgba(${hexToRgb(color)},0.22)`;fill.classList.toggle('full',pct>=99.5);}
      }
      if(rem===0&&t.state!=='alarm'&&t.state!=='done'){triggerAlarm(t);nR=true;}
      return;
    }
    // countdown: running中、またはalarmBefores系アラーム中もカウント継続
    const hasBefores=(t.alarmBefores||[]).length>0;
    if(t.type==='countdown'&&(t.state==='running'||(t.state==='alarm'&&hasBefores&&t.remaining>0))){
      if(!t.endTime) t.endTime = Date.now() + t.remaining * 1000;
      t.remaining=Math.max(0,Math.ceil((t.endTime-Date.now())/1000));
      if(!t._alarmFiredBefores)t._alarmFiredBefores={};
      // 残り○秒前アラームを各々チェック
      (t.alarmBefores||[]).forEach(secs=>{
        if(t.remaining<=secs&&t.remaining>0&&!t._alarmFiredBefores[secs]){
          t._alarmFiredBefores[secs]=true;
          triggerAlarmAt(t,secs);nR=true;
        }
      });
      // 残り0アラーム（必ず発火）
      if(t.remaining===0&&!t._alarmFired&&t.alarmType!=='none'){
        triggerAlarm(t);nR=true;checkTimerEndTriggers(t.id,t.endTime);
      } else if(t.remaining===0&&!t._endProcessed){
        t._endProcessed=true;checkTimerEndTriggers(t.id,t.endTime);
        if(t.onEnd==='reset'){t.remaining=t.total;t.state='idle';t._alarmFiredBefores={};}
        else if(t.onEnd==='remove')timers=timers.filter(x=>x.id!==t.id);
        else t.state='done';nR=true;
      } else if(t.remaining>0){
        t._endProcessed=false;
        const el=document.getElementById(`time-${t.id}`);
        if(el){el.textContent=fmtTime(t.remaining);const c=getColor(t);el.style.color=c;const fill=el?.closest('.slot')?.querySelector('.slot-fill');if(fill){const pct=(1-t.remaining/t.total)*100;fill.style.width=`${pct}%`;fill.style.background=`rgba(${hexToRgb(c)},0.22)`;fill.classList.toggle('full',pct>=99.5);}}
      }
    }
  });
  if(nR)render();
  save();
}

/* ── PWA: Service Worker登録 ── */
if('serviceWorker' in navigator){
  const swCode=`
const CACHE='timer-v1';
const ASSETS=[location.pathname||'/'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
}

/* ── 明るさ設定 ── */
function applyBrightness(val){
  const v=parseInt(val);
  const lo=(v/100).toFixed(2);
  const hi=Math.min(1,(v*1.8/100)).toFixed(2);
  document.documentElement.style.setProperty('--text2',`rgba(255,255,255,${hi})`);
  document.documentElement.style.setProperty('--text3',`rgba(255,255,255,${lo})`);
  localStorage.setItem('brightness',val);
}
function toggleBrightnessPanel(){
  const p=document.getElementById('brightness-panel');
  p.style.display=p.style.display==='none'?'':'none';
}

/* ── Screen Wake Lock ── */
let _wakeLock=null;
let _wakeLockEnabled=false;

async function requestWakeLock(){
  if(!('wakeLock' in navigator)){return;}
  try{
    _wakeLock=await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release',()=>{
      // バックグラウンド移行などで自動解除された場合、再取得を試みる
      _wakeLock=null;
      if(_wakeLockEnabled)setTimeout(requestWakeLock,1000);
    });
  }catch(e){
    // 非対応環境やページ非表示時は無視
  }
}

function releaseWakeLock(){
  if(_wakeLock){_wakeLock.release();_wakeLock=null;}
}

function updateWakeLockUI(){
  const btn=document.getElementById('btn-wakelock');
  const iconOn=document.getElementById('wakelock-icon-on');
  const iconOff=document.getElementById('wakelock-icon-off');
  const label=document.getElementById('wakelock-label');
  if(!btn)return;
  if(_wakeLockEnabled){
    btn.style.background='#1a2a42';btn.style.borderColor='#2a4468';btn.style.color='#6aaaf0';
    iconOn.style.display='';iconOff.style.display='none';
    label.textContent='画面ON';
  }else{
    btn.style.background='';btn.style.borderColor='';btn.style.color='';
    iconOn.style.display='none';iconOff.style.display='';
    label.textContent='画面ON';
  }
}

async function toggleWakeLock(){
  if(!('wakeLock' in navigator)){
    alert('このブラウザはScreen Wake Lock APIに対応していません。');return;
  }
  _wakeLockEnabled=!_wakeLockEnabled;
  if(_wakeLockEnabled){await requestWakeLock();}
  else{releaseWakeLock();}
  updateWakeLockUI();
  localStorage.setItem('wakeLockEnabled',_wakeLockEnabled?'1':'0');
}

// ページ表示復帰時に再取得（バックグラウンドから戻ったとき）
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&_wakeLockEnabled&&!_wakeLock){
    await requestWakeLock();
  }
});

/* ── 初期化 ── */
load();
// 明るさ設定を復元
(function(){
  const b=localStorage.getItem('brightness');
  if(b){document.getElementById('brightness-slider').value=b;applyBrightness(b);}
})();
render();
tick(); // 初回チェックを即時実行
setInterval(tick,1000);
// Wake Lock設定を復元
(function(){
  const wl=localStorage.getItem('wakeLockEnabled');
  if(wl==='1'){_wakeLockEnabled=true;requestWakeLock();updateWakeLockUI();}
  else{updateWakeLockUI();}
})();
</script>
